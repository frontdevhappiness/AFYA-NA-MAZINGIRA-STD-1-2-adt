      #content [data-section-id="pg017_sec001"] [data-id="pg017_n0015"] > .pg017-activity-number {
        color: #8b174c !important;
        font-family: "Atkinson Hyperlegible", Arial, sans-serif !important;

<body class="min-h-screen flex items-center justify-center">
    <main class="w-full">
      <h1 class="sr-only" id="page-heading">Afya na Mazingira</h1>
      <div id="content" class="container mx-auto opacity-0"><section data-section-type="text_and_images" data-section-id="pg017_sec001" class="w-full bg-white"><div class="mx-auto w-full max-w-5xl px-8 py-10 max-sm:px-5"><div class="relative rounded-[1.75rem] border-4 border-pink-500 bg-white px-8 pb-8 pt-16 shadow-[0_10px_24px_rgba(236,72,153,0.10)] max-sm:px-5 max-sm:pb-6 max-sm:pt-14"><div class="absolute left-10 top-0 -translate-y-1/2 -rotate-2 max-sm:left-5"><div class="rounded-[1.2rem] bg-pink-500 px-6 py-3 text-white shadow-[6px_6px_0_rgba(0,0,0,0.18)]"><p data-id="pg017_n0015" class="adt-h2 font-extrabold text-white">Shughuli ya <span class="pg017-activity-number">4</span></p></div></div><div class="rounded-[1.5rem] border-2 border-cyan-400 bg-white px-6 py-6 max-sm:px-5 max-sm:py-5"><div class="space-y-4 text-slate-800"><p class="adt-body leading-8"><span data-id="pg017_n0016">(a) Angalia au chunguza mtandaoni video inayoonesha hatua za kusafisha masikio.</span></p><p class="adt-body leading-8"><span data-id="pg017_n0017">(b) Safisha masikio yako kwa kufuata hatua ulizojifunza.</span></p></div></div></div></div></section></div>
    </main>

    <div class="relative z-50" id="interface-container"></div>
    <div class="relative z-50" id="nav-container"></div>
    <script src="./assets/offline-preloader.js?v=pg017-activity-number-upright-20260812"></script>
    <script src="./assets/scorm.js"></script>
    <script src="./assets/base.bundle.local.js"></script>
    <script>
      (() => {
        const heading = document.querySelector('[data-id="pg017_n0015"]');
        if (!heading) return;

        const wrapActivityNumber = () => {
          if (heading.children.length) return;
          const match = heading.textContent.trim().match(/^(.*\S)\s+4$/);
          if (!match) return;
          heading.textContent = `${match[1]} `;
          const number = document.createElement('span');
          number.className = 'pg017-activity-number';
          number.textContent = '4';
          heading.append(number);
        };

        new MutationObserver(wrapActivityNumber).observe(heading, {
          childList: true,
          characterData: true,
          subtree: true
        });
        wrapActivityNumber();
      })();
    </script>
</body>

</html>
